name: Build and Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # 先删除 macOS 生成的 lockfile 再 npm install：
        # npm 的 lockfile 是平台感知的，跨平台时不会为其他平台补 optional 依赖
        #（@rolldown/binding-linux-x64-gnu 等 native binding 会缺失，npm/cli#4828）。
        # 在 linux runner 上重新解析会生成包含 linux binding 的 lockfile，
        # 后续 Docker 构建步骤也使用这份 lockfile。
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Type check
        run: npm run type-check

      - name: Run tests
        run: npm run test

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):latest"
            SITE_DIR="/opt/1panel/apps/openresty/openresty/www/sites/newshub.shenzjd.com/index"
            ENV_FILE="$SITE_DIR/.env"

            # .env 为容器环境变量的来源，由 docker run --env-file 注入，
            # 服务器上直接编辑该文件即可改配置，重启生效。
            # 首次部署时创建空文件(空 env-file 合法)，确保文件可读。
            if [ ! -f "$ENV_FILE" ]; then sudo touch "$ENV_FILE"; fi
            sudo chown 1001:1001 "$ENV_FILE"

            sudo docker pull "$IMAGE"
            sudo docker stop newshub newshub.shenzjd.com || true
            sudo docker rm newshub newshub.shenzjd.com || true

            # 数据目录(缓存等)挂载到宿主机，容器重建不丢。
            # bind mount 会覆盖镜像层属主，需显式 chown 为容器 UID(1001)。
            sudo mkdir -p "$SITE_DIR/data"
            sudo chown -R 1001:1001 "$SITE_DIR"
            sudo docker run -d \
              --name newshub \
              --restart unless-stopped \
              -p 3000:3000 \
              -v "$SITE_DIR/data":/app/data \
              --env-file "$ENV_FILE" \
              "$IMAGE"
            sudo docker image prune -f || true

            echo "✅ 部署完成: newshub"
