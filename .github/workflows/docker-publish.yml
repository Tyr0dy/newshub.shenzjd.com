# Docker build, push, and deploy workflow
# 参考 shenzjd.com 的 .github/workflows/docker.yml 整体配置：
# 仅推送 GitHub Container Registry（ghcr.io），部署走 SSH 密码登录 + docker run 直部署
name: Create and publish a Docker image

on:
  push:
    branches:
      - main
  # Triggered by workflow_dispatch
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 登录 GHCR 使用内置 GITHUB_TOKEN，无需额外配置 Docker Hub 用户名/密码
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Always emit a `latest` tag so the deploy step can pull `:latest`.
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=true

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # 生成镜像 provenance 证明，增强供应链安全
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        continue-on-error: true
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # Deploy the freshly pushed image to the production server over SSH.
  deploy:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):latest"
            CONTAINER="${{ github.event.repository.name }}"
            ENV_FILE="/opt/1panel/apps/openresty/openresty/www/sites/newshub.shenzjd.com/index/.env"
            DATA_DIR="$HOME/apps/newshub/data"
            mkdir -p "$DATA_DIR"
            sudo docker pull "$IMAGE"
            sudo docker stop "$CONTAINER" || true
            sudo docker rm "$CONTAINER" || true
            ENV_FLAGS=""
            if [ -f "$ENV_FILE" ]; then
              ENV_FLAGS="--env-file $ENV_FILE"
            fi
            sudo docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              --memory=512m \
              --memory-swap=768m \
              --cpus=1.0 \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              -e NODE_OPTIONS="--max-old-space-size=256" \
              $ENV_FLAGS \
              -v "$DATA_DIR:/app/data" \
              -p 3000:3000 \
              "$IMAGE"
            sudo docker image prune -f
