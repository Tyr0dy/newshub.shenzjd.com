name: Build and Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # 先删除 macOS 生成的 lockfile 再 npm install：
        # npm 的 lockfile 是平台感知的，跨平台时不会为其他平台补 optional 依赖
        #（@rolldown/binding-linux-x64-gnu 等 native binding 会缺失，npm/cli#4828）。
        # 在 linux runner 上重新解析会生成包含 linux binding 的 lockfile，
        # 后续 Docker 构建步骤也使用这份 lockfile。
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Type check
        run: npm run type-check

      - name: Run tests
        run: npm run test

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          # 回显服务器端命令输出，便于排查部署错误
          debug: true
          script: |
            set -e

            IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):latest"
            SITE_DIR="/opt/1panel/apps/openresty/openresty/www/sites/newshub.shenzjd.com/index"
            ENV_FILE="$SITE_DIR/.env"

            # .env 为容器环境变量的来源，由 docker run --env-file 注入，
            # 服务器上直接编辑该文件即可改配置，重启生效。
            # 首次部署时创建空文件(空 env-file 合法)，确保文件可读。
            if [ ! -f "$ENV_FILE" ]; then sudo touch "$ENV_FILE"; fi
            sudo chown 1001:1001 "$ENV_FILE" || true

            sudo docker pull "$IMAGE"
            sudo docker stop newshub newshub.shenzjd.com || true
            sudo docker rm newshub newshub.shenzjd.com || true

            # 数据目录(缓存等)挂载到宿主机，容器重建不丢。
            # bind mount 会覆盖镜像层属主，需显式 chown 为容器 UID(1001)。
            sudo mkdir -p "$SITE_DIR/data"
            sudo chown -R 1001:1001 "$SITE_DIR" || true

            # 启动容器；失败时输出容器日志，让 CI 显示真实错误
            # 资源限制参考 shenzjd.com 模板：内存上限 512m（防止低配机器 OOM），
            # NODE_OPTIONS 限制 V8 heap（应用实际 heap 仅 ~30MB，256m 绰绰有余）
            if ! sudo docker run -d \
              --name newshub \
              --restart unless-stopped \
              --memory 512m \
              --memory-swap 512m \
              -p 6703:3000 \
              -e NODE_OPTIONS=--max-old-space-size=256 \
              -v "$SITE_DIR/data":/app/data \
              --env-file "$ENV_FILE" \
              "$IMAGE"; then
              echo "❌ docker run 失败，最近容器日志:"
              sudo docker logs --tail 50 newshub 2>&1 || true
              exit 1
            fi

            # 健康检查：确认服务真正启动成功
            echo "等待服务启动..."
            for i in $(seq 1 20); do
              if curl -sf http://localhost:6703/api/v1/health >/dev/null 2>&1; then
                echo "✅ 服务健康检查通过"
                sudo docker image prune -f || true
                exit 0
              fi
              sleep 2
            done

            echo "❌ 服务未在 40 秒内就绪，容器日志:"
            sudo docker logs --tail 50 newshub 2>&1 || true
            exit 1
