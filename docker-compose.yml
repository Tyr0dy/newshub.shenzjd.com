version: "3.8"

services:
  newshub:
    # 远程镜像（服务器部署推荐，GitHub Actions 自动构建并推送 GHCR）
    image: ghcr.io/wu529778790/newshub.shenzjd.com:latest
    # 本地开发构建镜像：注释掉上面的 image，改用下面这行
    # build: .
    container_name: newshub
    ports:
      - "6702:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      # 如果需要，取消注释并设置这些环境变量
      # - SITE_URL=https://your-domain.com
      # - API_SECRET=your-secret-key
    volumes:
      # 持久化数据和缓存
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - newshub-network

networks:
  newshub-network:
    driver: bridge
